services:
  db:
    image: postgres:16-alpine
    container_name: smp_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - smp_net

  php:
    build:
      context: ./docker/php
    container_name: smp_php
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smp_net

  nginx:
    image: nginx:1.27-alpine
    container_name: smp_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro
      - ./frontend/dist/frontend/browser:/var/www/frontend:ro
    depends_on:
      - php
    networks:
      - smp_net

  admin:
    image: admin:latest
    container_name: smp_admin
    restart: unless-stopped
    ports:
      - "${ADMIN_PORT}:8080"
    depends_on:
      - db
    profiles:
      - debug
    networks:
      - smp_net

volumes:
  db_data:

networks:
  smp_net:
    driver: bridge